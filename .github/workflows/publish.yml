name: Publish component

on:
  release:
    types: [published]

jobs:
  upload_components:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/upload-components-ci-action@v2
        with:
          namespace: "4dsystems"
          components: "esp32s3_lcd: ."
